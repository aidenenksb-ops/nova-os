<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#080914">
<title>NOVA OS — Home</title>
<style>
:root {
  --bg: #080914;
  --panel: rgba(22, 25, 48, .72);
  --line: rgba(145, 157, 255, .19);
  --blue: #59d8ff;
  --purple: #a77bff;
  --muted: #9298b8;
  --white: #f4f5ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--white); }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
  background:
    radial-gradient(ellipse at 15% 10%, rgba(68, 90, 210, .25), transparent 42%),
    radial-gradient(ellipse at 90% 38%, rgba(135, 65, 220, .20), transparent 38%),
    linear-gradient(155deg, #080914 0%, #10132a 55%, #080914 100%);
}
button { font: inherit; color: inherit; }
.screen { width: 100%; max-width: 390px; min-height: 100vh; margin: 0 auto; padding: 17px 17px 25px; position: relative; }
.topbar { display:flex; justify-content:space-between; align-items:center; font-size:11px; letter-spacing:.08em; color:#dfe5ff; }
.brand { font-size:12px; font-weight:800; letter-spacing:.24em; color:var(--blue); text-shadow:0 0 14px rgba(89,216,255,.7); }
.status { color:#d9dcf6; }
.hero { margin-top:33px; }
.greeting { color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
.clock { margin-top:5px; font-size:58px; line-height:1; font-weight:200; letter-spacing:-.06em; text-shadow:0 0 24px rgba(89,216,255,.16); }
.date { color:#b5bbd8; font-size:13px; margin-top:8px; }
.widget {
  background:linear-gradient(135deg, rgba(35,42,79,.75), rgba(20,19,43,.65));
  border:1px solid var(--line); border-radius:19px; padding:15px;
  box-shadow:0 12px 35px rgba(0,0,0,.18), inset 0 1px rgba(255,255,255,.05);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.status-widget { margin-top:25px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.widget-label { color:#aeb6da; font-size:10px; text-transform:uppercase; letter-spacing:.15em; }
.widget-title { font-size:16px; font-weight:600; margin-top:6px; }
.widget-sub { color:var(--muted); font-size:11px; margin-top:5px; }
.orb { width:48px; height:48px; border-radius:50%; flex:none; background:radial-gradient(circle at 35% 30%, #d4f8ff, #59d8ff 25%, #6b62e8 60%, #211c54 76%); box-shadow:0 0 23px rgba(89,216,255,.38), 0 0 35px rgba(167,123,255,.2); }
.section-head { display:flex; justify-content:space-between; align-items:center; margin:25px 2px 12px; }
.section-head strong { font-size:12px; letter-spacing:.15em; text-transform:uppercase; }
.section-head span { color:var(--muted); font-size:10px; }
.apps { display:grid; grid-template-columns:repeat(4,1fr); gap:17px 8px; }
.app { border:0; background:transparent; padding:0; text-align:center; cursor:pointer; -webkit-tap-highlight-color:transparent; }
.app-icon { width:55px; height:55px; margin:0 auto 7px; border-radius:17px; display:grid; place-items:center; font-size:24px;
  background:linear-gradient(145deg, rgba(66,82,147,.65), rgba(34,28,75,.85));
  border:1px solid rgba(155,169,255,.25); box-shadow:0 7px 18px rgba(0,0,0,.22), inset 0 1px rgba(255,255,255,.12);
  transition:transform .18s ease, box-shadow .18s ease;
}
.app:active .app-icon { transform:scale(.91); box-shadow:0 0 22px rgba(89,216,255,.35); }
.app-name { font-size:10px; color:#d6daf2; }
.dock { margin-top:25px; padding:12px 10px; border-radius:23px; background:rgba(28,31,59,.72); border:1px solid var(--line); display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
.dock .app-icon { width:48px; height:48px; margin-bottom:0; border-radius:15px; }
.dock .app-name { display:none; }
.footer { text-align:center; color:#69708f; font-size:9px; letter-spacing:.16em; margin-top:18px; }
.toast { position:fixed; left:50%; bottom:25px; transform:translate(-50%,20px); opacity:0; pointer-events:none; padding:11px 16px; border:1px solid var(--line); border-radius:15px; background:rgba(19,22,45,.96); color:#eaf0ff; font-size:12px; box-shadow:0 8px 30px #0008; transition:all .25s ease; max-width:90%; text-align:center; }
.toast.show { opacity:1; transform:translate(-50%,0); }
.scanline { position:fixed; inset:0; pointer-events:none; opacity:.08; background:repeating-linear-gradient(to bottom, transparent 0 3px, rgba(160,180,255,.12) 4px); mix-blend-mode:screen; }
@media (max-height: 620px) {
 .hero { margin-top:22px; } .clock { font-size:50px; } .status-widget { margin-top:18px; }
 .section-head { margin-top:19px; } .apps { gap:12px 8px; } .dock { margin-top:18px; }
}
</style>
</head>
<body>
<main class="screen">
  <div class="topbar">
    <span class="brand">NOVA</span>
    <span class="status">● Wi-Fi &nbsp; ▰ <span id="battery">100%</span></span>
  </div>

  <section class="hero">
    <div class="greeting">YOUR SPACE. YOUR SYSTEM.</div>
    <div class="clock" id="clock">16:08</div>
    <div class="date" id="date">Sunday, 8 November</div>
  </section>

  <section class="widget status-widget">
    <div>
      <div class="widget-label">System status</div>
      <div class="widget-title">All systems ready</div>
      <div class="widget-sub">NOVA interface preview · iPhone edition</div>
    </div>
    <div class="orb" aria-hidden="true"></div>
  </section>

  <div class="section-head"><strong>Applications</strong><span>SELECT TO OPEN</span></div>
  <section class="apps" aria-label="Applications">
    <button class="app" data-app="Messages"><span class="app-icon">✉</span><span class="app-name">Messages</span></button>
    <button class="app" data-app="Camera"><span class="app-icon">◉</span><span class="app-name">Camera</span></button>
    <button class="app" data-app="Music"><span class="app-icon">♫</span><span class="app-name">Music</span></button>
    <button class="app" data-app="Gallery"><span class="app-icon">▧</span><span class="app-name">Gallery</span></button>
    <button class="app" data-app="Browser"><span class="app-icon">◎</span><span class="app-name">Browser</span></button>
    <button class="app" data-app="Weather"><span class="app-icon">☼</span><span class="app-name">Weather</span></button>
    <button class="app" data-app="Notes"><span class="app-icon">▤</span><span class="app-name">Notes</span></button>
    <button class="app" data-app="Settings"><span class="app-icon">⚙</span><span class="app-name">Settings</span></button>
  </section>

  <nav class="dock" aria-label="Dock">
    <button class="app" data-app="Phone"><span class="app-icon">⌕</span><span class="app-name">Phone</span></button>
    <button class="app" data-app="Safari"><span class="app-icon">◌</span><span class="app-name">Safari</span></button>
    <button class="app" data-app="Mail"><span class="app-icon">✉</span><span class="app-name">Mail</span></button>
    <button class="app" data-app="Settings"><span class="app-icon">⚙</span><span class="app-name">Settings</span></button>
  </nav>
  <div class="footer">NOVA OS · CONCEPT 001</div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scanline"></div>
<script>
(function () {
  var clock = document.getElementById('clock');
  var date = document.getElementById('date');
  var toast = document.getElementById('toast');
  var toastTimer;

  function updateClock() {
    var now = new Date();
    clock.textContent = now.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', hour12: false});
    date.textContent = now.toLocaleDateString([], {weekday: 'long', day: 'numeric', month: 'long'});
  }
  function showToast(message) {
    toast.textContent = message;
    toast.className = 'toast show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.className = 'toast'; }, 1900);
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-app]'), function (button) {
    button.addEventListener('click', function () {
      var name = button.getAttribute('data-app');
      if (name === 'Safari') {
        window.location.href = 'https://www.google.com';
      } else if (name === 'Browser') {
        window.location.href = 'https://www.google.com';
      } else {
        showToast(name + ' · app shortcut preview');
      }
    });
  });
  updateClock();
  setInterval(updateClock, 1000);
}());
</script>
</body>
</html>
